services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tb4}
      POSTGRES_USER: ${POSTGRES_USER:-tb4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-unsafe-change-this-before-production}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      POSTGRES_DB: ${POSTGRES_DB:-tb4}
      POSTGRES_USER: ${POSTGRES_USER:-tb4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      SMS_SIMULATED_DELAY_SECONDS: ${SMS_SIMULATED_DELAY_SECONDS:-1.5}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
